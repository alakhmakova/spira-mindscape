<svg xmlns="http://www.w3.org/2000/svg" viewBox="12.9 22.34 70 70" width="32" height="32"
     role="img" aria-label="Spira">
  <!-- **The Spira mark** - a sprout, in Kale on a white tile (owner, 2026-10-10). It replaced the
       Guava flower, which disappeared against a dark browser tab bar.

       Source: "Plant by Firda Wahyu Dianti from Noun Project" (CC BY 3.0,
       https://thenounproject.com/browse/icons/term/plant/), credited in Settings > Licences
       (ARTWORK_CREDITS in src/lib/spira/licences.ts). Decisions that are not the drawing's:

       - Only the sprout is kept. The sparkle, the three rays and the wavy ground are dropped;
         the ground was one outline with the stem, so it is cut off where the stem meets it and
         the stem gets a round foot (the arc at the end of the path).
       - The leaves are filled, and the shape carries a 2.2-unit Kale stroke as well: the drawn
         line is 1.5 units of a 110-unit drawing, about a quarter of a pixel at 16 px - invisible
         in a tab. Filled and thickened it reads at 16 px on a light and a dark tab bar alike.
       - The white tile is part of the icon, so the Kale has a ground of its own whatever the
         browser's theme puts behind it. -->
  <rect x="12.9" y="22.34" width="70" height="70" rx="15" fill="#FFFFFF"/>
