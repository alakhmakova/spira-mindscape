<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `interactive-widget=resizes-content` is the web's `imePadding()`: without it the on-screen
      keyboard is drawn OVER the page and the layout viewport does not change, so a sheet pinned
      to the bottom — the AI panel on a phone, every form drawer — keeps its full height and the
      field you just tapped ends up behind the keys (owner, 2026-08-24, on the proposal card's
      Edit box). With it the viewport shrinks, `dvh` follows, and a bottom-anchored sheet sits
      above the keyboard the way it does on Android.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fbf9f4" />
    <title>Spira - Structured thinking, planning, execution</title>
    <meta
      name="description"
      content="Spira is an AI-powered goal achievement system. Define meaningful goals, break them into targets, and execute with a calm, structured workspace."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
