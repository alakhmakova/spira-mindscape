# Full goal for the workspace screen: the five sections (Goal, Reality, Options, Targets,
# Resources).
query GetGoal($id: ID!) {
  goalById(id: $id) {
    id
    title
    description
    confidence
    deadline
    createdAt
    achievedAt
    progress
    confidenceHistory {
      id
      confidence
      at
    }
    reality {
      id
      actions { id text }
      obstacles { id text }
    }
    options {
      id
      text
      selected
      position
    }
    targets {
      id
      type
      title
      start
      current
      total
      unit
      done
      progress
      progressLocked
      deadline
      achievedAt
      createdAt
      items { id text done deadline achievedAt }
    }
    resources {
      id
      type
      title
      body
      url
      mime
      dataUrl
      driveWebViewLink
      name
      email
      role
      phone
    }
  }
}
