# Goals dashboard. Only what a card renders: GoalSummary has no description field, so asking for
# it downloaded up to 5000 characters per goal on every dashboard load and dropped them on the
# floor. Ask for a field here only when a card actually shows it.
query GetGoals {
  goals {
    id
    title
    confidence
    deadline
    createdAt
    achievedAt
    progress
    targets {
      id
      type
      title
      progress
      done
      current
      total
      unit
    }
  }
}
