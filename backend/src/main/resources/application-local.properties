spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/spira}
spring.datasource.username=${DATABASE_USERNAME:spira}
spring.datasource.password=${DATABASE_PASSWORD:spira}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Human-readable console locally; JSON is only useful to Cloud Logging.
logging.structured.format.console=

# Dev tooling needs GraphQL introspection (disabled by default for prod).
spring.graphql.schema.introspection.enabled=true

# One local database serves every branch, and branches number their migrations independently:
# `mobile` carries V23-V29 (the CV work) while this line of work starts at V30. Run one branch and
# then another, and Flyway finds migrations in the history that the second branch's code does not
# have, and refuses to start ("applied migration not resolved locally"). Locally that is expected,
# so a migration applied from another branch is skipped rather than fatal. Local profile ONLY:
# production has one history and must keep failing loudly on any gap.
spring.flyway.ignore-migration-patterns=*:missing,*:future
